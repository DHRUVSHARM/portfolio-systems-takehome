apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          datasourceUid: jaeger
          url: "$${__value.raw}"

  - name: PostgreSQL Historical Analytics
    uid: postgres-historical-analytics
    type: postgres
    access: proxy
    url: postgres:5432
    database: portfolio_analytics
    user: ${POSTGRES_USER}
    jsonData:
      postgresVersion: 1600
      sslmode: disable
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
