services:
  portfolio-api:
    depends_on:
      vllm:
        condition: service_healthy
      otel-collector:
        condition: service_started

  vllm:
    image: ${VLLM_GPU_IMAGE:-vllm/vllm-openai:v0.8.5}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        python -m vllm.entrypoints.openai.api_server
        --host 0.0.0.0
        --port 8000
        --model "$${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}"
        --served-model-name "$${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen3-4B-Instruct-2507}"
        $${VLLM_MODEL_REVISION:+--revision "$${VLLM_MODEL_REVISION}"}
        --dtype "$${VLLM_DTYPE:-bfloat16}"
        --max-model-len "$${VLLM_MAX_MODEL_LEN:-4096}"
        --max-num-seqs "$${VLLM_MAX_NUM_SEQS:-32}"
        --gpu-memory-utilization "$${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
        $${VLLM_ENABLE_PREFIX_CACHING:+--enable-prefix-caching}
        $${VLLM_MAX_NUM_BATCHED_TOKENS:+--max-num-batched-tokens "$${VLLM_MAX_NUM_BATCHED_TOKENS}"}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen3-4B-Instruct-2507}
      VLLM_MODEL_REVISION: ${VLLM_MODEL_REVISION:-}
      VLLM_DTYPE: ${VLLM_DTYPE:-bfloat16}
      VLLM_MAX_MODEL_LEN: ${VLLM_MAX_MODEL_LEN:-4096}
      VLLM_MAX_NUM_SEQS: ${VLLM_MAX_NUM_SEQS:-32}
      VLLM_MAX_NUM_BATCHED_TOKENS: ${VLLM_MAX_NUM_BATCHED_TOKENS:-}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      VLLM_ENABLE_PREFIX_CACHING: ${VLLM_ENABLE_PREFIX_CACHING:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
    networks:
      - backend
      - observability
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=5).read()\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    volumes:
      - ../../observability/prometheus/prometheus.gpu.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    networks:
      - observability
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
